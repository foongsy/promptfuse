[project]
name = "promptfuse"
version = "0.1.0"
description = "Local prompt registry with a Langfuse-compatible read API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptfuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
